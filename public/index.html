<style>
:root{--bg:#05080f;--pn:#0a1424;--ln:#1d4e7a;--bl:#4fc3ff;--tx:#d6ecff;--dm:#6f8aa5;--rd:#ff4d6a;--pu:#8a5cff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:radial-gradient(120% 60% at 50% 0,#0b1d33,var(--bg) 60%);color:var(--tx);font:600 16px/1.35 system-ui,sans-serif;min-height:100vh;padding-bottom:calc(76px + env(safe-area-inset-bottom,0px))}
main{max-width:480px;margin:0 auto;padding:14px}
.pn{background:linear-gradient(180deg,#0c1a2e,var(--pn));border:1px solid var(--ln);border-radius:4px;padding:12px 14px;margin:0 0 12px;box-shadow:0 0 14px #4fc3ff1f inset,0 0 10px #4fc3ff14}
h1{font-size:22px;margin:0;letter-spacing:.5px;text-shadow:0 0 12px #4fc3ff99}
h2{font-size:15px;margin:0 0 8px;color:var(--bl);letter-spacing:.4px}
.sub{color:var(--dm);font-size:14px}
.row{display:flex;align-items:center;gap:10px}.row input{flex:1;min-width:0}.sp{justify-content:space-between}
.bn{border-color:var(--rd);color:#ffc1cb;background:#2a0b14}.bn.ok{border-color:var(--bl);color:var(--tx);background:#0a1c33}
.t{display:flex;align-items:center;gap:12px;padding:12px;border:1px solid var(--ln);border-radius:4px;margin-bottom:8px;background:#08111f;width:100%;color:inherit;font:inherit;text-align:left;min-height:56px}
.t.d{border-color:var(--bl);box-shadow:0 0 12px #4fc3ff40}.t.d .tt{text-decoration:line-through;color:var(--dm)}
.bx{width:26px;height:26px;border:2px solid var(--ln);border-radius:3px;flex:none;display:grid;place-items:center;color:var(--bg)}
.t.d .bx{background:var(--bl);border-color:var(--bl);box-shadow:0 0 10px var(--bl)}
.tt{flex:1}.tg{font-size:13px;color:var(--bl)}
a.lk{color:var(--bl);font-size:14px;padding:6px 0;display:inline-block}
.pen{border-color:var(--rd)}.pen .tg{color:var(--rd)}.pen.d{border-color:var(--bl)}
input,select{background:#08111f;color:var(--tx);border:1px solid var(--ln);border-radius:4px;padding:11px;font:inherit;font-size:16px;width:100%;min-height:44px}
button.b{background:var(--bl);color:#04101c;border:0;border-radius:4px;padding:0 16px;font:700 16px system-ui,sans-serif;min-height:44px;flex:none}
.bar{height:10px;background:#0a1830;border:1px solid var(--ln);border-radius:2px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,#1b7fc4,var(--bl));box-shadow:0 0 8px var(--bl)}
.big{font-size:46px;line-height:1;font-weight:700;color:var(--bl);text-shadow:0 0 16px var(--bl)}
.rk{font-size:46px;font-weight:700;color:var(--pu);text-shadow:0 0 16px var(--pu);line-height:1}
.g{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.c{background:none;border:0;padding:0;color:var(--dm);font:inherit;font-size:11px;text-align:center;aspect-ratio:1;position:relative}
.c svg{width:100%;height:100%}.c span{position:absolute;inset:0;display:grid;place-items:center}
.c.sel span{color:var(--bl)}.c.lock{opacity:.35}
.army{display:flex;flex-wrap:wrap;gap:4px}.army svg{width:22px;height:26px}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:#060d18f2;border-top:1px solid var(--ln);padding-bottom:env(safe-area-inset-bottom,0px);backdrop-filter:blur(8px)}
nav button{flex:1;background:none;border:0;color:var(--dm);font:700 15px system-ui,sans-serif;padding:16px 0;min-height:56px}nav button.on{color:var(--bl);text-shadow:0 0 10px var(--bl)}
/* The Websites tab is intentionally quieter than the quest dashboard. */
.websites-page{color:var(--tx)}.websites-page h1{text-shadow:none}
.website-sync-hint{display:block;width:100%;text-align:left;padding:8px 0;margin:-4px 0 10px;background:transparent;border:0;border-bottom:1px solid #1b2735;color:#8492a2;font:400 11px/1.4 system-ui,sans-serif}
.website-kicker{font-size:11px;letter-spacing:2px;color:#718096;margin-bottom:5px}
.website-title{font-size:25px;letter-spacing:.2px;text-shadow:none;margin-bottom:20px}
.website-counts{display:grid;grid-template-columns:repeat(3,1fr);gap:0;border-top:1px solid #1b2735;border-bottom:1px solid #1b2735;margin:18px 0 14px}
.website-counts.with-sold{grid-template-columns:repeat(4,1fr)}
.website-counts>div{padding:13px 8px 12px 0;border-right:1px solid #1b2735}.website-counts>div+div{padding-left:12px}.website-counts>div:last-child{border:0}
.website-counts strong{display:block;font-size:29px;line-height:1.1;font-weight:600;color:#dbe2ea}.website-counts span{display:block;color:#738092;font-size:9px;letter-spacing:1.3px;margin-top:5px}
.website-followup{display:block;width:100%;padding:9px 0;margin:0 0 14px;text-align:left;background:transparent;border:0;border-bottom:1px solid #1b2735;color:#a3acb8;font:500 13px system-ui,sans-serif}.website-followup:before{content:'';display:inline-block;width:6px;height:6px;border-radius:50%;background:#8a96a4;margin:0 9px 1px 1px}.website-followup.selected{color:#d8dde4}
.website-filter-label{font-size:10px;letter-spacing:1.4px;color:#788595;margin:0 0 10px}.website-filter-label button{float:right;border:0;background:none;color:#9ca8b6;font:inherit;text-decoration:underline}
.website-list{border-top:1px solid #1b2735}.website-row{display:flex;align-items:center;gap:11px;width:100%;padding:11px 0;background:transparent;color:inherit;text-align:left;border:0;border-bottom:1px solid #1b2735;font:inherit;min-height:68px}.website-thumb{width:55px;height:42px;object-fit:cover;background:#111820;border:1px solid #26313e;flex:none}.website-row-copy{min-width:0;flex:1}.website-row-copy strong,.website-row-copy span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.website-row-copy strong{font-size:14px;font-weight:550;color:#d4d9df}.website-row-copy span{font-size:11px;color:#718092;margin-top:3px;font-weight:400}.website-row-status{font-size:10px;letter-spacing:.6px;color:#8e9aa8}.website-row-arrow{font-size:20px;color:#596574;margin-left:2px}.website-empty{padding:30px 2px;color:#a0a9b5;font-size:14px;line-height:1.7}.website-empty span{font-size:12px;color:#657384}
.website-fab{position:fixed;z-index:4;right:max(18px,calc((100vw - 480px)/2 + 18px));bottom:calc(78px + env(safe-area-inset-bottom,0px));width:52px;height:52px;border:1px solid #3a4858;border-radius:50%;background:#d5dde5;color:#111820;font:300 30px/1 system-ui,sans-serif;box-shadow:0 6px 18px #0008}.website-heading{margin-bottom:18px}.website-back{width:34px;height:34px;border:1px solid #25313f;border-radius:50%;background:transparent;color:#a9b4c0;font:24px/1 system-ui}.website-status{font-size:11px;color:#98a4b2;letter-spacing:.8px;text-transform:uppercase}.website-form{border-top:1px solid #1b2735;padding-top:15px}.website-label{display:block;margin:13px 0 6px;color:#a9b3be;font-size:12px;font-weight:500}.website-label span{float:right;color:#667487;font-size:10px;text-transform:uppercase;letter-spacing:.8px}.website-form input,.website-note{background:#080d14;border:1px solid #28323e;border-radius:2px;color:#d8dfe7;font-weight:400}.website-help{font-size:11px;color:#697787;margin-top:5px}.website-date{border-top:1px solid #1b2735;margin-top:17px;padding:12px 0;font-size:12px;color:#abb5c0}.website-date span{float:right;color:#687586}.website-add-preview{display:block;width:100%;max-height:220px;object-fit:contain;background:#070a0e;border:1px solid #202b38;margin:8px 0}.website-image-actions{margin-top:8px}.website-action,.website-cancel{background:transparent;border:1px solid #2b3744;color:#adb7c2;border-radius:2px;padding:9px 11px;font:500 12px system-ui;min-height:38px}.website-form-actions{margin-top:10px}.website-save{flex:1;min-height:44px;border:0;border-radius:2px;background:#cbd4de;color:#111820;font:650 14px system-ui}.website-save:disabled{background:#222b35;color:#697583}.website-cancel{min-width:85px}.website-detail-image{display:block;width:100%;max-height:58vh;object-fit:contain;background:#070a0e;border:1px solid #202b38;margin:0 0 9px}.website-live-link{display:inline-block;color:#aebdcb;text-decoration:none;font-size:12px;padding:8px 0 14px}.website-status-row{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid #25313e;border-bottom:1px solid #25313e;margin:8px 0 0}.website-status-button{background:none;border:0;color:#778492;padding:13px 2px;font:500 10px system-ui}.website-status-button.current{color:#e0e5eb;font-weight:700}.website-status-button.passed{color:#a2acb7}.website-status-button.current:before{content:'• ';color:#cbd4de}.website-sent-date{font-size:11px;color:#768392;padding:7px 0 13px}.website-note{display:block;width:100%;min-height:88px;resize:vertical;padding:10px;font:400 14px/1.4 system-ui}.website-note-save{margin-top:8px}
@keyframes website-built{0%{transform:scale(.88);opacity:.2}60%{transform:scale(1.04);opacity:1}100%{transform:scale(1);opacity:1}}
.website-counts strong{animation:website-built .3s ease-out}
@media(prefers-reduced-motion:reduce){.website-counts strong{animation:none}}
.msg{position:fixed;left:14px;right:14px;bottom:calc(86px + env(safe-area-inset-bottom,0px));max-width:452px;margin:auto;z-index:5;text-align:center;animation:f 2.6s forwards}
@keyframes f{0%,80%{opacity:1}100%{opacity:0}}
@media (prefers-reduced-motion:reduce){.msg{animation:none}}
.t:disabled{opacity:.75}:focus-visible{outline:2px solid var(--bl);outline-offset:2px}
